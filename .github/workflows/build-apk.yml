name: build-apk

# Builds the Android debug APK and runs the core unit tests. Read-only: nothing is pushed or released.
# The APK is uploaded as a workflow artifact (Actions run page -> Artifacts). Publishing a GitHub Release is a
# separate step that needs the repository owner's authorization and is intentionally not automated here.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses (SDK is preinstalled on this runner image)
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls "$ANDROID_HOME" || true
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Provision Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Generate Gradle wrapper 8.10.2 (only if not committed)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2
          fi

      - name: Core unit tests (rules, solver, vision)
        run: gradle :core:test --warning-mode all --stacktrace

      - name: Build debug APK
        run: gradle :app:assembleDebug --warning-mode all --stacktrace

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('core/build/test-results/test/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print("## :core test results")
          print(f"tests={t} failures={f} errors={e} skipped={s}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports-apk-job
          path: |
            core/build/reports/tests/
            core/build/reports/theme-robustness.txt
            core/build/test-results/
          if-no-files-found: warn

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: block-blast-assistant-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload generated wrapper (commit these files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.10.2-apk-job
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          if-no-files-found: warn
