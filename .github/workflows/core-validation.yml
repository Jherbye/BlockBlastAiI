name: core-validation

# Independent build validation for the pure-Kotlin :core module.
# Read-only: it checks out, builds, tests and uploads reports. It never pushes or commits.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Provision Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Toolchain versions
        run: |
          java -version
          gradle --version

      - name: Generate Gradle wrapper 8.10.2 (only if not committed)
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.10.2
          fi
          ls -la gradlew gradle/wrapper

      - name: Compile main and test sources
        run: gradle :core:compileKotlin :core:compileTestKotlin --warning-mode all --stacktrace

      - name: Run core test suite
        run: gradle :core:test --warning-mode all --stacktrace

      - name: Validate wrapper (rerun tests through ./gradlew)
        run: ./gradlew :core:test --rerun-tasks --stacktrace

      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, xml.etree.ElementTree as ET
          t=f=e=s=0
          for p in glob.glob('core/build/test-results/test/*.xml'):
              r=ET.parse(p).getroot()
              t+=int(r.get('tests',0)); f+=int(r.get('failures',0)); e+=int(r.get('errors',0)); s+=int(r.get('skipped',0))
          print("## :core test results")
          print(f"tests={t} failures={f} errors={e} skipped={s}")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests/
            core/build/test-results/
          if-no-files-found: warn

      - name: Upload generated wrapper (commit these files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gradle-wrapper-8.10.2
          path: |
            gradlew
            gradlew.bat
            gradle/wrapper/
          if-no-files-found: warn
